# Functional only: results are synthetic and must not be reported in papers.
experiment:
  name: trajrep_fl_femnist
  seed: 42
  output_dir: results/synthetic_smoke
federated:
  num_clients: 4
  clients_per_round_fraction: 0.5
  num_rounds: 1
  local_epochs: 1
  local_batch_size: 32
  learning_rate: 0.01
  server_learning_rate: 1.0
  momentum: 0.9
dataset:
  name: femnist
  path: data/femnist
  num_classes: 62
  non_iid_type: natural
model:
  name: cnn_femnist
  input_channels: 1
  num_classes: 62
adversary:
  fraction: 0.2
  payload: backdoor
  strategy: static
  trigger_size: 3
  trigger_position: bottom_right
  target_class: 0
  delay_rounds: 30
  drift_duration: 50
  pgd_steps: 20
  pgd_lr: 0.01
  expose_own_reliability: true
  stealth_budget: 0.15
trajrep_fl:
  embedding_dim: 8
  gru_layers: 2
  projection_dim: 16
  projection_seed: 42
  gamma: 0.9
  gamma_fast: 0.7
  gamma_slow: 0.1
  beta: 0.5
  mlp_hidden: 16
  clip_R: 5.0
  epsilon_agg: 0.0
  delta_init: 0.05
  delta_min: 0.05
  delta_max: 0.7
  delta_floor: 0.05
  T_wu: 10
  upsilon_S: 0.1
  upsilon_V: 0.05
  kappa_rec: 5.0
  theta_rec: 0.6
  recovery_window: 5
  learning_rate_traj: 0.001
  weight_decay_traj: 1.0e-05
  lambda_smooth: 0.1
  lambda_ent: 0.01
  lambda_cal: 1.0
  epsilon_cal: 0.0001
  grad_clip: 5.0
  eps_norm: 1.0e-08
evaluation:
  target_acc_threshold: 60.0
  random_asr_baseline: 1.6
